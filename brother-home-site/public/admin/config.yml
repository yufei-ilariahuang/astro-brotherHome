backend:
  # Netlify production CMS auth via Netlify Identity + Git Gateway.
  name: git-gateway
  # Set your Git repo here for production, e.g. "owner/repo".
  # Netlify/Decap will use this when running on Netlify with Git Gateway enabled.
  # repo: owner/repo
  branch: main

site_url: https://effervescent-haupia-6c1414.netlify.app
display_url: https://effervescent-haupia-6c1414.netlify.app

# Keep this enabled for local testing with `npx decap-server`.
local_backend: true

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: products
    label: Products
    folder: src/content/products
    create: true
    format: frontmatter
    extension: md
    slug: '{{slug}}'
    fields:
      - { label: Product Name, name: title, widget: string }
      - label: Category
        name: category
        widget: select
        options:
          - { label: "Cabinets / Kitchen Cabinets", value: kitchen-cabinets }
          - { label: "Flooring / Hardwood & Laminate Flooring", value: hardwood-laminate-flooring }
          - { label: "Quartz Stone / Quartz Countertops", value: quartz-countertops }
          - { label: "Water Basin / Sinks & Basins", value: sinks-basins }
          - { label: "Handles / Cabinet Hardware & Pulls", value: cabinet-hardware-pulls }
          - { label: "Bathroom Cabinet / Bathroom Vanities", value: bathroom-vanities }
          - { label: "Bathroom Door / Shower Doors & Enclosures", value: shower-doors-enclosures }
      - { label: SKU, name: sku, widget: string, required: false }
      - { label: Product Image, name: image, widget: image, required: false }
      - { label: English Description, name: descriptionEn, widget: text, required: false }
      - { label: Chinese Description, name: descriptionZh, widget: text, required: false }
      - { label: Price, name: price, widget: string, required: false }
      - { label: Dimensions, name: dimensions, widget: string, required: false }
      - { label: Material, name: material, widget: string, required: false }
      - label: Status
        name: status
        widget: select
        options:
          - { label: Available, value: available }
          - { label: Sold, value: sold }
      - { label: Hidden Draft, name: draft, widget: boolean, required: false, default: false }
      - { label: Sort Order (smaller shows first), name: order, widget: number, required: false, value_type: int }
